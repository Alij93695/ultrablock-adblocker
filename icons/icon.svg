<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer shield glow -->
  <path d="M64 16 L102 32 C102 72, 64 104, 64 112 C64 104, 26 72, 26 32 Z" 
        fill="none" 
        stroke="#8b5cf6" 
        stroke-width="3" 
        opacity="0.5" 
        filter="url(#glow)" />

  <!-- Main Shield -->
  <path d="M64 22 L96 36 C96 70, 64 98, 64 104 C64 98, 32 70, 32 36 Z" 
        fill="url(#shieldGrad)" />

  <!-- Inner Lightning Bolt / Zap for aggressive ad destruction -->
  <polygon points="68,36 50,62 62,62 58,88 80,58 68,58" fill="#ffffff" />
</svg>
